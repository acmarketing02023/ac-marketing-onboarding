<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Marketing - Client Onboarding</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function OnboardingForm() {
            const [step, setStep] = useState('form');
            const [formData, setFormData] = useState({
                marketingGoal: '',
                adSpend: '',
                platforms: [],
                companyName: '',
                website: '',
                email: '',
                phone: '',
                challenge: '',
                existingAccounts: '',
            });

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleCheckboxChange = (platform) => {
                setFormData(prev => ({
                    ...prev,
                    platforms: prev.platforms.includes(platform)
                        ? prev.platforms.filter(p => p !== platform)
                        : [...prev.platforms, platform]
                }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                console.log('Form submitted:', formData);
                setStep('confirmation');
            };

            if (step === 'confirmation') {
                return (
                    <div style={styles.container}>
                        <div style={styles.confirmationBox}>
                            <div style={styles.checkmark}>✓</div>
                            <h1 style={styles.confirmationTitle}>You're All Set!</h1>
                            <p style={styles.confirmationText}>
                                Thanks for completing your onboarding form. We've received your information and our team will review it shortly.
                            </p>
                            <p style={styles.confirmationText}>
                                You'll hear from us within 24 hours with next steps. In the meantime, if you have any questions, feel free to reach out.
                            </p>
                            <p style={styles.confirmationCTA}>We're excited to partner with you!</p>
                        </div>
                    </div>
                );
            }

            return (
                <div style={styles.container}>
                    {/* Welcome Section */}
                    <div style={styles.welcomeSection}>
                        <img
                            src="./Logo AC Marketing.png"
                            alt="AC Marketing"
                            style={styles.logo}
                        />
                        <h1 style={styles.welcomeTitle}>Welcome to AC Marketing!</h1>
                        <p style={styles.welcomeSubtitle}>
                            Let's get you set up and ready to grow. Answer a few quick questions below.
                        </p>
                    </div>

                    <form onSubmit={handleSubmit} style={styles.form}>
                        {/* Quick Qualifier Section */}
                        <div style={styles.section}>
                            <h2 style={styles.sectionTitle}>Tell Us About Your Goals</h2>

                            {/* Marketing Goal */}
                            <div style={styles.formGroup}>
                                <label style={styles.label}>What's your primary marketing goal?</label>
                                <select
                                    name="marketingGoal"
                                    value={formData.marketingGoal}
                                    onChange={handleInputChange}
                                    required
                                    style={styles.select}
                                >
                                    <option value="">Select an option</option>
                                    <option value="lead-gen">Lead Generation</option>
                                    <option value="sales">Sales & Revenue</option>
                                    <option value="brand-awareness">Brand Awareness</option>
                                    <option value="traffic">Website Traffic</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>

                            {/* Ad Spend */}
                            <div style={styles.formGroup}>
                                <label style={styles.label}>What's your current monthly ad spend?</label>
                                <select
                                    name="adSpend"
                                    value={formData.adSpend}
                                    onChange={handleInputChange}
                                    required
                                    style={styles.select}
                                >
                                    <option value="">Select a range</option>
                                    <option value="under-1k">Under $1,000</option>
                                    <option value="1k-5k">$1,000 - $5,000</option>
                                    <option value="5k-10k">$5,000 - $10,000</option>
                                    <option value="10k-plus">$10,000+</option>
                                </select>
                            </div>

                            {/* Platforms */}
                            <div style={styles.formGroup}>
                                <label style={styles.label}>Which platforms are you currently using? (Select all that apply)</label>
                                <div style={styles.checkboxGroup}>
                                    {['Google Ads', 'Meta (Facebook/Instagram)', 'TikTok', 'LinkedIn'].map(platform => (
                                        <label key={platform} style={styles.checkboxLabel}>
                                            <input
                                                type="checkbox"
                                                checked={formData.platforms.includes(platform)}
                                                onChange={() => handleCheckboxChange(platform)}
                                                style={styles.checkbox}
                                            />
                                            {platform}
                                        </label>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Intake Form Section */}
                        <div style={styles.section}>
                            <h2 style={styles.sectionTitle}>Your Business Details</h2>

                            {/* Company Name */}
                            <div style={styles.formGroup}>
                                <label style={styles.label}>Company Name *</label>
                                <input
                                    type="text"
                                    name="companyName"
                                    value={formData.companyName}
                                    onChange={handleInputChange}
                                    required
                                    placeholder="Your company name"
                                    style={styles.input}
                                />
                            </div>

                            {/* Website */}
                            <div style={styles.formGroup}>
                                <label style={styles.label}>Website <span style={{color: '#999', fontWeight: '400'}}>Optional</span></label>
                                <input
                                    type="url"
                                    name="website"
                                    value={formData.website}
                                    onChange={handleInputChange}
                                    placeholder="https://yourwebsite.com"
                                    style={styles.input}
                                />
                            </div>

                            {/* Email */}
                            <div style={styles.formGroup}>
                                <label style={styles.label}>Email *</label>
                                <input
                                    type="email"
                                    name="email"
                                    value={formData.email}
                                    onChange={handleInputChange}
                                    required
                                    placeholder="your@email.com"
                                    style={styles.input}
                                />
                            </div>

                            {/* Phone */}
                            <div style={styles.formGroup}>
                                <label style={styles.label}>Phone Number *</label>
                                <input
                                    type="tel"
                                    name="phone"
                                    value={formData.phone}
                                    onChange={handleInputChange}
                                    required
                                    placeholder="(123) 456-7890"
                                    style={styles.input}
                                />
                            </div>

                            {/* Challenge */}
                            <div style={styles.formGroup}>
                                <label style={styles.label}>What's your biggest marketing challenge right now? *</label>
                                <textarea
                                    name="challenge"
                                    value={formData.challenge}
                                    onChange={handleInputChange}
                                    required
                                    placeholder="Tell us briefly..."
                                    style={styles.textarea}
                                    rows="3"
                                />
                            </div>

                            {/* Existing Accounts */}
                            <div style={styles.formGroup}>
                                <label style={styles.label}>Do you have existing ad accounts we should know about?</label>
                                <select
                                    name="existingAccounts"
                                    value={formData.existingAccounts}
                                    onChange={handleInputChange}
                                    style={styles.select}
                                >
                                    <option value="">Select an option</option>
                                    <option value="yes">Yes</option>
                                    <option value="no">No</option>
                                    <option value="unsure">Not sure</option>
                                </select>
                            </div>
                        </div>

                        {/* Submit Button */}
                        <button type="submit" style={styles.submitButton}>
                            Complete Onboarding
                        </button>
                    </form>
                </div>
            );
        }

        const styles = {
            container: {
                maxWidth: '600px',
                margin: '0 auto',
                padding: '40px 20px',
                backgroundColor: '#f9f9f9',
                minHeight: '100vh',
            },
            welcomeSection: {
                textAlign: 'center',
                marginBottom: '40px',
                paddingBottom: '30px',
                borderBottom: '1px solid #e0e0e0',
            },
            logo: {
                width: '200px',
                height: '100px',
                marginBottom: '20px',
                objectFit: 'contain',
            },
            welcomeTitle: {
                fontSize: '28px',
                fontWeight: '700',
                color: '#1a1a1a',
                margin: '0 0 10px 0',
            },
            welcomeSubtitle: {
                fontSize: '16px',
                color: '#666',
                margin: '0',
                lineHeight: '1.5',
            },
            form: {
                backgroundColor: '#fff',
                padding: '30px',
                borderRadius: '8px',
                boxShadow: '0 2px 8px rgba(0,0,0,0.05)',
            },
            section: {
                marginBottom: '30px',
            },
            sectionTitle: {
                fontSize: '18px',
                fontWeight: '600',
                color: '#1a1a1a',
                marginBottom: '20px',
                margin: '0 0 20px 0',
            },
            formGroup: {
                marginBottom: '20px',
            },
            label: {
                display: 'block',
                fontSize: '14px',
                fontWeight: '500',
                color: '#333',
                marginBottom: '8px',
            },
            input: {
                width: '100%',
                padding: '10px 12px',
                fontSize: '14px',
                border: '1px solid #ddd',
                borderRadius: '6px',
                boxSizing: 'border-box',
                fontFamily: 'inherit',
                transition: 'border-color 0.2s',
                outline: 'none',
            },
            textarea: {
                width: '100%',
                padding: '10px 12px',
                fontSize: '14px',
                border: '1px solid #ddd',
                borderRadius: '6px',
                boxSizing: 'border-box',
                fontFamily: 'inherit',
                resize: 'none',
                transition: 'border-color 0.2s',
                outline: 'none',
            },
            select: {
                width: '100%',
                padding: '10px 12px',
                fontSize: '14px',
                border: '1px solid #ddd',
                borderRadius: '6px',
                boxSizing: 'border-box',
                fontFamily: 'inherit',
                backgroundColor: '#fff',
                cursor: 'pointer',
                outline: 'none',
            },
            checkboxGroup: {
                display: 'flex',
                flexDirection: 'column',
                gap: '10px',
            },
            checkboxLabel: {
                display: 'flex',
                alignItems: 'center',
                fontSize: '14px',
                color: '#333',
                cursor: 'pointer',
            },
            checkbox: {
                width: '18px',
                height: '18px',
                marginRight: '10px',
                cursor: 'pointer',
            },
            submitButton: {
                width: '100%',
                padding: '12px',
                fontSize: '16px',
                fontWeight: '600',
                color: '#fff',
                backgroundColor: '#1a1a1a',
                border: 'none',
                borderRadius: '6px',
                cursor: 'pointer',
                transition: 'background-color 0.2s',
            },
            confirmationBox: {
                backgroundColor: '#fff',
                padding: '40px',
                borderRadius: '8px',
                textAlign: 'center',
                boxShadow: '0 2px 8px rgba(0,0,0,0.05)',
            },
            checkmark: {
                fontSize: '60px',
                color: '#4caf50',
                marginBottom: '20px',
            },
            confirmationTitle: {
                fontSize: '28px',
                fontWeight: '700',
                color: '#1a1a1a',
                margin: '0 0 20px 0',
            },
            confirmationText: {
                fontSize: '15px',
                color: '#666',
                lineHeight: '1.6',
                marginBottom: '15px',
            },
            confirmationCTA: {
                fontSize: '16px',
                fontWeight: '600',
                color: '#1a1a1a',
                marginTop: '25px',
            },
        };

        ReactDOM.render(<OnboardingForm />, document.getElementById('root'));
    </script>
</body>
</html>
